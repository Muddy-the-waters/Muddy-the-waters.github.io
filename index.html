<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股实战工具 & HK 通道指引</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 24px;
        }
        .item {
            font-size: 16px;
            color: #374151;
            margin: 12px 0;
            line-height: 1.6;
        }
        .wechat {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            background: #f3f4f6;
            padding: 10px 16px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }
        .warning {
            margin-top: 30px;
            font-size: 14px;
            color: #d97706;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">美股实战工具 & H.K 通道指引</div>
        <div class="item">请添加微信获取信息</div>
        <div class="wechat">Muddy-the-waters</div>
        <div class="item">添加请备注：美股 享专属通道指引</div>
        <div class="item">入群畅所欲言 享一手美股资讯</div>
        <div class="warning">⚠️ 投资有风险，开户需本人实名办理</div>
    </div>
</body>
</html>
